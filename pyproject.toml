[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-geo"
version = "0.4.0"
description = "Geospatial MCP server — give AI agents geocoding, routing, spatial ops, and OSM querying via the Model Context Protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Tabib Hasan", email = "tabibhasann@gmail.com"}]
keywords = ["mcp", "geospatial", "geocoding", "routing", "gis", "openstreetmap", "model-context-protocol", "ai-tools", "llm-tools", "spatial", "maps", "reverse-geocoding", "isochrones", "elevation", "timezone", "bounding-box", "geojson", "wkt", "shapefile", "cli", "developer-tools", "automation", "gis-tools", "location-data", "address-parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "mcp>=1.0.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/tabibhasann/geo-mcp"
Repository = "https://github.com/tabibhasann/geo-mcp"
Issues = "https://github.com/tabibhasann/geo-mcp/issues"
Changelog = "https://github.com/tabibhasann/geo-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
files = ["pyogrio>=0.8", "geopandas>=0.14"]
raster = ["rasterio>=1.3", "rasterstats>=0.19"]
visual = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "ruff>=0.4", "mypy>=1.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
mcp-geo = "geo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyproj.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rasterstats.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "geopandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyogrio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=geo_mcp --cov-report=term-missing --cov-report=html --cov-report=lcov --cov-fail-under=70"
